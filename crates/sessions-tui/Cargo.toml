[package]
name = "sessions-tui"
version = "0.3.1"
edition = "2021"
description = "A terminal UI for coding-agent sessions: transcript, prompt box, permission modal. Backend-agnostic (a trait), no async runtime."
license = "MIT"
repository = "https://github.com/ramene/remote-sessions"
homepage = "https://github.com/ramene/remote-sessions"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "ratatui", "terminal"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
signal-hook = "0.3"
serde_json = "1"
unicode-width = "0.2"
# Rasterizes the optional logo SVG: no text, no raster images, no system fonts (vector paths only).
resvg = { version = "0.46", default-features = false }
