[package]
name = "remote-sessions-cli"
version = "0.3.1"
edition = "2021"
description = "remote-sessions: serve, list, send, events and stop for Claude Code Remote Control sessions (JSON output), plus an MCP server."
license = "MIT"
repository = "https://github.com/ramene/remote-sessions"
homepage = "https://github.com/ramene/remote-sessions"
readme = "README.md"
keywords = ["claude", "claude-code", "agents", "cli", "sessions"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "remote-sessions"
path = "src/main.rs"

[dependencies]
remote-sessions-core = { path = "../remote-sessions-core", version = "0.3.1" }
sessions-tui = { path = "../sessions-tui", version = "0.3.1" }
serde_json = "1"
crossterm = "0.28"
