[package]
name = "remote-sessions-cli"
version = "0.2.2"
edition = "2021"
description = "remote-sessions: serve, list, send, events and stop for Claude Code Remote Control sessions (JSON output), plus an MCP server."
license = "MIT"

[[bin]]
name = "remote-sessions"
path = "src/main.rs"

[dependencies]
remote-sessions-core = { path = "../remote-sessions-core" }
serde_json = "1"
